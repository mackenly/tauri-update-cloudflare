name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Test
              run: npm test
